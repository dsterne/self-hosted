      KOMETA_CONFIG: /config/config.yml #optional
      KOMETA_TIME: 03:00 #optional
      KOMETA_RUN: True #optional
      KOMETA_TEST: False #optional
      KOMETA_NO_MISSING: False #optional
    volumes:
      - ./kometa/config:/config

  kiwix-wikipedia:
    image: "ghcr.io/kiwix/kiwix-serve"
    container_name: "kiwix-wikipedia"
    restart: "never"
    ports:
      - "8882:8080"
    environment:
      <<: *common-app-variables
    command: "wikipedia_en_all_maxi_2024-01.zim"
    volumes:
      - "/mnt/md0/wikipedia:/data"
